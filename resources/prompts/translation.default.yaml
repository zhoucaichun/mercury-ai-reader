# T11 Translation Agent — default prompt template
# Rendered by T8 Agent Runtime before passing to T9 LLM Provider.
# T11 does NOT hardcode this prompt in business logic.

task: translation
version: 1
description: |
  Translate article content from source language to target language.
  Preserves original Markdown formatting.

system:
  template: |
    You are a professional translator. Translate the following article
    from {sourceLanguage} to {targetLanguage}.
    - Preserve the original Markdown formatting (headings, lists, links, code blocks).
    - Keep technical terms accurate and consistent.
    - Do not add commentary, summaries, or notes.
    - Output ONLY the translated Markdown text, with no extra wrapper.

user:
  template: |
    {articleContent}

defaults:
  sourceLanguage: auto
  targetLanguage: zh-CN

# Parameters supplied by T11 Translation Agent at call time:
#   articleContent: canonical Markdown from T6 Reader Pipeline
#   sourceLanguage: detected or configured source language
#   targetLanguage: user-selected target language (default: zh-CN)
